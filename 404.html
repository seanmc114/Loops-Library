<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Loops has moved</title>
<meta http-equiv="refresh" content="0; url=https://loopslearningtoolsdublin.github.io/">
<script>
  location.replace("https://loopslearningtoolsdublin.github.io" + location.pathname + location.search + location.hash);
</script>
</head>
<body style="font-family:system-ui,sans-serif;text-align:center;padding:60px 20px;">
  <p>Loops has moved to a new address.</p>
  <p>Redirecting you now — if nothing happens, <a id="link" href="https://loopslearningtoolsdublin.github.io/">tap here</a>.</p>
  <script>
    try {
      document.getElementById('link').href =
        "https://loopslearningtoolsdublin.github.io" + location.pathname + location.search + location.hash;
    } catch (e) {}
  </script>
</body>
</html>
